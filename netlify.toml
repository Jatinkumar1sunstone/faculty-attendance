[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# ADMIN_USER (a plain username) and TIMEZONE are not secrets, but their values
# appear naturally in the source code and would fail Netlify's secrets scan.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USER,TIMEZONE"
